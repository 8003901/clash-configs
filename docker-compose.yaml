services:
  clash-configs:
    image: clash-configs:0.0.1-SNAPSHOT-native
    # native 镜像与架构强绑定；仓库现有华为 SWR 基础镜像（debian/openjdk）均为 amd64，
    # 故这里固定为 amd64（arm64 机器上会走 Rosetta 模拟，与既有 JVM 镜像行为一致）
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8780:8780"
    volumes:
      - ./backend/data:/data
    container_name: clash-configs
    restart: always
    environment:
      # 原生镜像没有 JVM，JAVA_OPTS 不再生效；端口改用 Spring Boot 宽松绑定环境变量
      SERVER_PORT: "8780"
      TZ: Asia/Shanghai
    cpus: "1"
    mem_limit: 512M
