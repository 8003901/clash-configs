services:
  clash-configs:
    image: clash-configs:0.0.1-SNAPSHOT-native
    # native 镜像与架构强绑定，目标部署为 linux x86_64
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8780:8780"
    volumes:
      - ./backend/data:/data
    container_name: clash-configs
    restart: always
    environment:
      # 原生镜像没有 JVM，JAVA_OPTS 不再生效；端口改用 Spring Boot 宽松绑定环境变量
      SERVER_PORT: "8780"
      TZ: Asia/Shanghai
    cpus: "1"
    mem_limit: 512M
