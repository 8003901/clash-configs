plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.hibernate.orm' version '7.2.12.Final'
    id 'org.graalvm.buildtools.native' version '1.1.1'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
}

group = 'com.jgayb'
version = '0.0.1-SNAPSHOT'
test.enabled = false

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 24
}

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public/'
    }
    maven {
        url 'https://maven.aliyun.com/repository/spring/'
    }
    maven { url "https://gitee.com/junjunyuanyuankeke/mvnrepo/raw/master" }
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_24
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

hibernate {
    enhancement {
        enableAssociationManagement = true
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
    useJUnitPlatform()
}

// —— 本地调试：先构建前端，再把产物同步到后端静态目录 ——
// 只挂在 bootRun 上，不挂 processResources/build，避免破坏 Docker 构建（Docker 只 build 后端、不装 Node）。
def frontendDistDir = "${rootProject.projectDir}/frontend/dist"
def backendStaticDir = "${projectDir}/src/main/resources/static"

tasks.register('syncFrontend', Sync) {
    dependsOn ':frontend:npm_run_build'
    from frontendDistDir
    into backendStaticDir
}

// 静态目录是 processResources 的输入源，声明顺序避免 Gradle 的隐式依赖校验报错。
// 用 mustRunAfter 而非 dependsOn：只在两者都执行时保证同步在前，不会让 build/Docker 强制构建前端。
tasks.named('processResources') {
    mustRunAfter 'syncFrontend'
}

tasks.named('bootRun') {
    dependsOn 'syncFrontend'
}
